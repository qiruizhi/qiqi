version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: davall-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: davall
      POSTGRES_PASSWORD: davall_dev_password
      POSTGRES_DB: davall
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U davall -d davall']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
